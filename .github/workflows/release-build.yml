name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: PlannerApp-windows
            archive_extension: zip
          - os: ubuntu-22.04
            artifact_name: PlannerApp-linux
            archive_extension: tar.gz
          # macOS escluso per ora: senza firma, notarizzazione e bundle .app il pacchetto
          # non si avvia (vedi doc/SVILUPPI_FUTURI.md, "Supporto macOS").

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: backend
        shell: python
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          import os
          import sys
          from config import APP_VERSION

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          if APP_VERSION != expected:
              sys.exit(
                  f"Version mismatch: APP_VERSION={APP_VERSION}, tag={expected}"
              )
          print(f"Release version verified: {APP_VERSION}")

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils libasound2 libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 \
            libdbus-1-3 libdrm2 libegl1 libfontconfig1 libgbm1 libgl1 \
            libglib2.0-0 libnss3 libpulse0 libsm6 libice6 \
            libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxcomposite1 \
            libxdamage1 libxext6 libxfixes3 libxi6 libxkbcommon-x11-0 \
            libxrandr2 libxrender1 libxss1 xdg-utils

      - name: Install backend and build dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Build portable app
        working-directory: backend
        run: python build_portable.py

      - name: Package Windows portable app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path backend/dist/PlannerApp/* -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Package Linux portable app
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.artifact_name }}.tar.gz -C backend/dist PlannerApp

      - name: Check Linux archive permissions
        if: runner.os == 'Linux'
        shell: python
        env:
          ARCHIVE_PATH: ${{ matrix.artifact_name }}.tar.gz
        run: |
          import os
          import tarfile

          with tarfile.open(os.environ["ARCHIVE_PATH"], "r:gz") as archive:
              for name in (
                  "PlannerApp/PlannerApp",
                  "PlannerApp/_internal/PyQt6/Qt6/libexec/QtWebEngineProcess",
              ):
                  entry = archive.getmember(name)
                  if not entry.isfile() or not entry.mode & 0o111:
                      raise SystemExit(f"Executable permission missing in archive: {name}")

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_extension }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          # Linux resta un artifact di prova finche build e verifiche native sono aperte.
          pattern: PlannerApp-windows
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
