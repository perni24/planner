name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: PlannerApp-windows
          - os: ubuntu-latest
            artifact_name: PlannerApp-linux
          # macOS escluso per ora: senza firma, notarizzazione e bundle .app il pacchetto
          # non si avvia (vedi doc/SVILUPPI_FUTURI.md, "Supporto macOS").

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend and build dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Build portable app
        working-directory: backend
        run: python build_portable.py

      - name: Package portable app
        shell: pwsh
        run: |
          Compress-Archive -Path backend/dist/PlannerApp/* -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
